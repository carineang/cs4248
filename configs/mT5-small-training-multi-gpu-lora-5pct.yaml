training_dataset_paths: 
  - "./tokenized_dataset/ALMA_Human_Parallel"
  - "./tokenized_dataset/WMT22_Train_Merged_5pct"
evaluation_dataset_paths:
  - "./tokenized_dataset/Tatoeba"
model_name: "google/mt5-small"
use_lora: True
lora_args:
  r: 32
  lora_alpha: 32
  target_modules: ['q','k','v','o']
training_args:
  output_dir: "./models/mt5-small-finetuned-lora-5pct-new"
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 1
  num_train_epochs: 1
  logging_dir: "./logs"
  logging_steps: 10
  save_steps: 500
  save_total_limit: 2
  predict_with_generate: False
  ddp_find_unused_parameters: False  # Important for DDP
  report_to: "none"  # Disable wandb reporting
  # fp16: True  # Enable mixed precision training